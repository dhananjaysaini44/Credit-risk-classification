services:
  - type: web
    name: crc-backend
    runtime: python
    plan: free # Change to 'starter' or higher for production use
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker backend.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
        placeholder: "https://your-vercel-domain.vercel.app,http://localhost:3000"
      - key: PYTHON_VERSION
        value: "3.11.1"
